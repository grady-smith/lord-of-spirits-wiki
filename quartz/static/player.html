<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancient Faith Audio Player</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0f1115;
            color: #d1d5db;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            flex-direction: column;
        }
        audio {
            width: 80%;
            max-width: 600px;
            margin-top: 20px;
        }
        h2 {
            font-weight: 600;
            margin-bottom: 10px;
            color: #f9fafb;
        }
        p {
            color: #9ca3af;
            font-size: 0.9em;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <h2>Ancient Faith Radio</h2>
    <p>Lord of Spirits Podcast</p>
    <audio id="audio-player" controls autoplay></audio>
    <script>
        const params = new URLSearchParams(window.location.search);
        let src = params.get('audio');
        if (src) {
            // Re-append the hash (like #t=123) if it's in the window location
            if (window.location.hash) {
                src += window.location.hash;
            }
            document.getElementById('audio-player').src = src;
        }
    </script>
</body>
</html>
